server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy /api/* to the backend container.
  #
  # `backend` resolves via docker DNS because this container joins the
  # backend stack's network (see docker-compose.yml). Backend expects
  # paths like /api/v1/auth/login — no rewrite, pass the URI through.
  #
  # Browser request:        /api/v1/courses
  # Forwarded to backend:   http://backend:8080/api/v1/courses
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback: any unknown path resolves to index.html so the
  # client-side router can take it from there.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets — cache aggressively. Vite emits content-hashed filenames
  # under /assets, so a year of cache is safe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # index.html itself must never be cached — it points at the latest hashed
  # bundle and must update immediately on deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
