# Frontend-only compose. The bundle calls `/api/...` on whatever
# origin served it — host nginx proxies `/api` through to the backend
# on the box, so the bundle is host-agnostic (works on IP, domain,
# HTTP, or HTTPS without rebuilding).
#
# Vite bakes VITE_API_BASE_URL at build time. Override via .env or
# shell only if you actually need a different host.

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: tutor-ui:dev
    container_name: tutor-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost) — BusyBox wget tries IPv6 first and
      # nginx only binds IPv4 by default → "Connection refused" forever.
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
