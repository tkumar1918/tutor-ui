# Frontend-only compose. The bundle calls `/api/...` on its own origin
# (tutor.webspacehub.in) — host nginx proxies `/api` through to the
# backend on the box, so no shared docker network is needed here.
#
# Vite bakes VITE_API_BASE_URL at build time. Override via .env or
# shell to point at a different host.

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://tutor.webspacehub.in/api}
    image: tutor-ui:dev
    container_name: tutor-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost) — BusyBox wget tries IPv6 first and
      # nginx only binds IPv4 by default → "Connection refused" forever.
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
