# Frontend-only compose. Pair with the backend repo's own compose
# (run them in two terminals — they're intentionally independent).
#
# Vite bakes VITE_API_BASE_URL at build time, so changing it requires
# a rebuild. Override via .env (copied from .env.example) or env var
# at the shell.

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    image: tutor-ui:dev
    container_name: tutor-ui
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
