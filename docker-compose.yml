# Frontend-only compose. Pair with the backend repo's own compose
# (run them in two terminals — they're intentionally independent).
#
# Vite bakes VITE_API_BASE_URL at build time, so changing it requires
# a rebuild. Override via .env (copied from .env.example) or env var
# at the shell.

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    image: tutor-ui:dev
    container_name: tutor-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (not localhost) — BusyBox wget tries IPv6 first and
      # nginx only binds IPv4 by default → "Connection refused" forever.
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
